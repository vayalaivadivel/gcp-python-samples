name: Infra Setup (payment-pubsub-dataflow)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "dev or prod"
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: "apply or destroy"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform-owner:
    name: Terraform (${{ github.event.inputs.action }}) - owner direct
    if: github.actor == 'YOUR_OWNER_USERNAME'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Remove stale Terraform lock
        run: |
          gsutil rm -f gs://vadivel_terraform_buc/payment-pipeline/${{ github.event.inputs.environment }}/default.tflock || true

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Remove stale Terraform lock
        run: |
          gsutil rm -f gs://vadivel_terraform_buc/payment-service/${{ github.event.inputs.environment }}/default.tflock || true

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=vadivel_terraform_buc" \
            -backend-config="prefix=payment-service/${{ github.event.inputs.environment }}"
            
      - name: 
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var="env=${{ github.event.inputs.environment }}" \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var="env=${{ github.event.inputs.environment }}" \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"

  terraform-approved:
    name: Terraform (${{ github.event.inputs.action }}) - approval required
    if: github.actor != 'YOUR_OWNER_USERNAME'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Remove stale Terraform lock
        run: |
          gsutil rm -f gs://vadivel_terraform_buc/payment-pipeline/${{ github.event.inputs.environment }}/default.tflock || true

      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=vadivel_terraform_buc" \
            -backend-config="prefix=payment-pipeline/${{ github.event.inputs.environment }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var="env=${{ github.event.inputs.environment }}" \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var="env=${{ github.event.inputs.environment }}" \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"
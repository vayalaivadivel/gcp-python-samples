name: Infra Setup (emp-etl)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "dev or prod"
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: "apply or destroy"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 🔐 WIF Authentication
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Remove stale Terraform lock
        run: |
          gsutil rm -f gs://vadivel_terraform_buc/etl-project/${{ github.event.inputs.environment }}/default.tflock || true

      # ✅ Always INIT
      - name: Terraform Init
        run: terraform init -input=false

      # ✅ Always PLAN (safety step)
      - name: Terraform Plan
        run: |
          terraform plan -input=false \
            -var="env=${{ github.event.inputs.environment }}" \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"

      # 🚀 APPLY
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply -input=false -auto-approve \
            -var="env=${{ github.event.inputs.environment }}" \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"

      # ❌ DESTROY
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy -input=false -auto-approve \
            -var="env=${{ github.event.inputs.environment }}" \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"
name: Terraform Infra (emp-etl)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "dev or prod"
        required: true
        type: choice
        options:
          - dev
          - prod
      action:
        description: "apply or destroy"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write     # 🔥 THIS FIXES YOUR ERROR
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: emp-etl/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # ✅ WIF Authentication
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file="env/${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -var-file="env/${{ github.event.inputs.environment }}.tfvars"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -var-file="env/${{ github.event.inputs.environment }}.tfvars"
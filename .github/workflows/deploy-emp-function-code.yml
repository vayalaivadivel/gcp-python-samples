name: Deploy Emp-Etl Function Code (emp-etl)

on:
  push:
    branches:
      - main
    paths:
      - "emp-etl/src/**"
      - ".github/workflows/deploy-function-code.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "dev or prod"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: project-d25d1c66-5ac7-43e4-974

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Create source zip
        run: |
          cd emp-etl/src
          zip -r ../../etl_function.zip .

      - name: Upload source zip to code bucket
        run: |
          gcloud storage cp etl_function.zip gs://${PROJECT_ID}-function-code-${ENV}/etl_function.zip

      - name: Deploy updated Cloud Function
        run: |
          gcloud functions deploy etl-function-${ENV} \
            --no-gen2 \
            --project=${PROJECT_ID} \
            --region=${{ secrets.GCP_REGION }} \
            --runtime=python311 \
            --entry-point=etl_handler \
            --source=emp-etl/src \
            --trigger-bucket=${PROJECT_ID}-input-${ENV} \
            --service-account=etl-fn-sa-${ENV}@${PROJECT_ID}.iam.gserviceaccount.com \
            --set-env-vars=INPUT_BUCKET=${PROJECT_ID}-input-${ENV},DB_HOST=${{ secrets.DB_HOST }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }} \
            --set-secrets=DB_PASS=projects/${PROJECT_ID}/secrets/ravula-password-${ENV}:latest \
            --memory=512MB \
            --timeout=540s \
            --quiet